<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- 
    Approach: Use stroke on a path to create thick S bands
    The S path drawn thin, then stroke-width makes it thick and bold
  -->
  
  <!-- Shadow/depth layer -->
  <path 
    d="M 155 50 C 155 25 135 12 110 12 L 55 12 C 30 12 15 27 15 50 C 15 73 30 88 55 88 L 110 88 C 125 88 135 98 135 112 C 135 126 125 136 110 136 L 45 136 C 20 136 5 151 5 174 C 5 197 20 212 45 212 L 145 212 C 170 212 185 197 185 174"
    fill="none"
    stroke="#C47D00"
    stroke-width="44"
    stroke-linecap="round"
    opacity="0.4"
  />
  
  <!-- Main S stroke — gold, thick, rounded -->
  <path 
    d="M 155 50 C 155 25 135 12 110 12 L 55 12 C 30 12 15 27 15 50 C 15 73 30 88 55 88 L 110 88 C 125 88 135 98 135 112 C 135 126 125 136 110 136 L 45 136 C 20 136 5 151 5 174 C 5 197 20 212 45 212 L 145 212 C 170 212 185 197 185 174"
    fill="none"
    stroke="#F5C518"
    stroke-width="40"
    stroke-linecap="round"
  />
  
  <!-- Highlight on top arc -->
  <path 
    d="M 155 50 C 155 25 135 12 110 12 L 55 12"
    fill="none"
    stroke="#FFE55C"
    stroke-width="40"
    stroke-linecap="round"
    opacity="0.3"
  />
</svg>
