<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D4860A"/>
    </linearGradient>
  </defs>

  <!-- GOLD upper C-shape (top arm of S, opens to the right) -->
  <!-- Outer arc -->
  <path d="M 165 18 L 52 18 C 28 18 10 34 10 58 C 10 82 28 98 52 98 L 120 98"
    fill="none" stroke="url(#gold)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Speed slash tip — top right diagonal cut -->
  <polygon points="148,0 185,0 175,36 138,36" fill="#0A1628"/>

  <!-- WHITE lower C-shape (bottom arm of S, opens to the left) -->
  <path d="M 35 82 L 148 82 C 172 82 190 98 190 122 C 190 146 172 162 148 162 L 30 162"
    fill="none" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Speed slash tip — bottom left diagonal cut -->
  <polygon points="15,144 52,144 62,180 25,180" fill="#0A1628"/>
</svg>
