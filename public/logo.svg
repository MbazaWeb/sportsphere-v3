<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The S: thick stroked path, two-tone: gold top, white bottom -->
  
  <!-- Full S path in gold -->
  <path 
    d="M 160 28 C 160 14 148 6 132 6 L 52 6 C 36 6 24 16 24 30 C 24 44 36 54 52 56 L 130 70 C 148 73 162 84 162 100 C 162 116 148 128 130 128 L 46 128 C 28 128 14 140 14 156 C 14 172 28 184 46 184 L 160 184"
    fill="none"
    stroke="#F5C518"
    stroke-width="38"
    stroke-linecap="round"
  />
  
  <!-- White overlay on bottom arm to create two-tone effect -->
  <path 
    d="M 46 128 C 28 128 14 140 14 156 C 14 172 28 184 46 184 L 160 184"
    fill="none"
    stroke="white"
    stroke-width="38"
    stroke-linecap="round"
    opacity="0.92"
  />
  
  <!-- Diagonal slash through middle — the speed mark -->
  <path
    d="M 145 56 L 55 128"
    fill="none"
    stroke="#0A1628"
    stroke-width="10"
  />
</svg>
