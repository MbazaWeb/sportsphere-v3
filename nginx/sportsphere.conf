# ─────────────────────────────────────────────────────────────────────────────
# SportSphere — Nginx reverse proxy
#
# Current state: IP-only (no SSL cert yet).
# When domain + cert are ready:
#   1. Point DNS → 104.152.50.173
#   2. sudo certbot --nginx -d sportsphere.app -d www.sportsphere.app
#   3. Uncomment the HTTPS server block below
# ─────────────────────────────────────────────────────────────────────────────

upstream sportsphere_app {
    server 127.0.0.1:3002;
    keepalive 64;
}

# ─── HTTP — Direct IP + future domain ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 104.152.50.173 sportsphere.app www.sportsphere.app _;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge (for when you run certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = / {
        return 302 http://$host/sportsphere;
    }
}

