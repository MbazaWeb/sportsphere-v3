# ─────────────────────────────────────────────────────────────────────────────
# VPS Nginx — Two apps on 104.152.50.173
#
#   /police      → police-platform   (PM2 port 3000)
#   /sportsphere → sportsphere-v3    (PM2 port 3002)
#
# To enable HTTPS later:
#   1. Point DNS → 104.152.50.173
#   2. sudo certbot --nginx -d sportsphere.app -d www.sportsphere.app
#   3. Uncomment the HTTPS server block at the bottom
# ─────────────────────────────────────────────────────────────────────────────

upstream sportsphere_app {
    server 127.0.0.1:3002;
    keepalive 64;
}

upstream police_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP — IP + future domains ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 104.152.50.173 sportsphere.app www.sportsphere.app sportssphere.fun www.sportssphere.fun _;

    client_max_body_size 110M;

    # Large proxy buffers to prevent ERR_CONNECTION_RESET on big JS chunks
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    # Serve uploaded files directly via nginx (bypasses Next.js for performance)
    location /sportsphere/uploads/ {
        alias /var/www/sportsphere-nextjs/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve static chunks with larger buffers and longer timeouts
    location /sportsphere/_next/static/ {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 256k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Cache static assets aggressively
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ── SportSphere ──────────────────────────────────────────────────────────
    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Larger buffers for SSR responses
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Police Platform ──────────────────────────────────────────────────────
    location /police {
        proxy_pass http://police_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Root → index page listing both apps ─────────────────────────────────
    location = / {
        return 200 '<html><body style="font-family:sans-serif;padding:2rem">
<h2>VPS Apps — 104.152.50.173</h2>
<ul>
<li><a href="/sportsphere">SportSphere</a></li>
<li><a href="/police">Police Platform</a></li>
</ul></body></html>';
        add_header Content-Type text/html;
    }
}

