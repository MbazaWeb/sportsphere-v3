# ─────────────────────────────────────────────────────────────────────────────
# Sportsphere — Nginx reverse proxy + Let's Encrypt HTTPS
# ─────────────────────────────────────────────────────────────────────────────
#
# This config terminates TLS at Nginx and proxies to the Next.js PM2 process
# listening on 127.0.0.1:3002. It also serves the ACME challenge directory
# for certbot renewals.
#
# Install:
#   sudo cp nginx/sportsphere.conf /etc/nginx/sites-available/sportsphere
#   sudo ln -s /etc/nginx/sites-available/sportsphere /etc/nginx/sites-enabled/sportsphere
#   sudo rm /etc/nginx/sites-enabled/default    # optional, removes the default site
#   sudo nginx -t                                # validate config
#   sudo systemctl reload nginx
#
# The proxy_pass URL uses the Docker-friendly host.docker.internal when
# available; on plain Ubuntu VPS deployments, use 127.0.0.1:3002 (the default
# below). Adjust to match your PM2 process port.
# ─────────────────────────────────────────────────────────────────────────────

# ─── HTTP → HTTPS redirect + ACME challenge ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sportsphere.app www.sportsphere.app;

    # ACME challenge directory for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else → redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS reverse proxy → Next.js (PM2 on port 3002) ────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportsphere.app www.sportsphere.app;

    # ─── TLS certificates (managed by certbot) ───────────────────────────────
    # These paths are created by `certbot --nginx -d sportsphere.app -d www.sportsphere.app`
    # certbot will rewrite these lines to point at /etc/letsencrypt/live/sportsphere.app/
    ssl_certificate     /etc/letsencrypt/live/sportsphere.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportsphere.app/privkey.pem;

    # ─── Modern TLS configuration (A+ on SSL Labs) ──────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ─── Body size limit (matches Next.js default; raise if you support large uploads) ──
    client_max_body_size 10M;

    # ─── Reverse proxy to Next.js PM2 process ───────────────────────────────
    location /sportsphere/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events support (for future Phase G realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering (disable for streaming responses; enable for static)
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }

    # ─── ACME challenge over HTTPS too (for renewals) ───────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # ─── Privacy Policy + ToS — short URLs (no /sportsphere prefix) ─────────
    # Apple/Google store listings expect https://sportsphere.app/privacy
    # Next.js serves them at /sportsphere/privacy — redirect the short URL.
    location = /privacy {
        return 301 https://$host/sportsphere/privacy;
    }
    location = /terms {
        return 301 https://$host/sportsphere/terms;
    }

    # ─── Root → app ─────────────────────────────────────────────────────────
    location = / {
        return 302 https://$host/sportsphere;
    }
}
