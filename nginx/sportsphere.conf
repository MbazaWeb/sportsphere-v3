# ─────────────────────────────────────────────────────────────────────────────
# SportSphere — Nginx reverse proxy
# ─────────────────────────────────────────────────────────────────────────────
#
# Two server blocks:
#   1. Direct IP access (104.152.50.173:80) — for VPS testing without a domain
#   2. Domain-based HTTPS (sportsphere.app) — for production with Let's Encrypt
#
# Install:
#   sudo cp nginx/sportsphere.conf /etc/nginx/sites-available/sportsphere
#   sudo ln -sf /etc/nginx/sites-available/sportsphere /etc/nginx/sites-enabled/sportsphere
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ─── Upstream ────────────────────────────────────────────────────────────────
upstream sportsphere_app {
    server 127.0.0.1:3002;
    keepalive 64;
}

# ─── Shared proxy settings (used in both server blocks) ──────────────────────
# (Nginx doesn't support include inside server blocks in all configs,
#  so settings are duplicated below — keep them in sync.)

# ─── 1. Direct IP access — http://104.152.50.173 ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 104.152.50.173 _;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # App
    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }

    # Root → app
    location = / {
        return 302 http://$host/sportsphere;
    }

    # Health check
    location = /health {
        proxy_pass http://sportsphere_app/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ─── 2. Domain HTTP → HTTPS redirect + ACME challenge ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sportsphere.app www.sportsphere.app;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 3. Domain HTTPS → Next.js (production with Let's Encrypt) ───────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportsphere.app www.sportsphere.app;

    # TLS (managed by certbot — run: certbot --nginx -d sportsphere.app)
    ssl_certificate     /etc/letsencrypt/live/sportsphere.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportsphere.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 10M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # App
    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location = /privacy { return 301 https://$host/sportsphere/privacy; }
    location = /terms   { return 301 https://$host/sportsphere/terms; }
    location = /        { return 302 https://$host/sportsphere; }
}
