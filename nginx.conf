# ─────────────────────────────────────────────────────────────────────────────
# VPS Nginx — SportSphere v3
#
# Setup:
#   1. Point DNS → your server IP
#   2. sudo certbot --nginx -d sportsphere.app -d www.sportsphere.app
#      (Certbot will fill in the ssl_certificate paths automatically)
#   3. Replace YOUR_DOMAIN_HERE with your actual domain before deploying
# ─────────────────────────────────────────────────────────────────────────────

upstream sportsphere_app {
    server 127.0.0.1:3002;
    keepalive 64;
}

upstream police_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP — redirect all traffic to HTTPS ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sportsphere.app www.sportsphere.app;

    # ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportsphere.app www.sportsphere.app;

    ssl_certificate     /etc/letsencrypt/live/sportsphere.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportsphere.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    client_max_body_size 20M;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── SportSphere ──────────────────────────────────────────────────────────
    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip any client-provided identity headers before they reach the app
        proxy_set_header X-User-Id "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Police Platform ──────────────────────────────────────────────────────
    location /police {
        proxy_pass http://police_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Root — no server/IP disclosure
    location = / {
        return 302 https://$host/sportsphere;
    }
}
