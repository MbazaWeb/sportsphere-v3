# SportSphere v3 — nginx
upstream sportsphere_app { server 127.0.0.1:3002; keepalive 64; }
upstream sportsphere_admin { server 127.0.0.1:3003; keepalive 64; }
upstream sportsphere_ws { server 127.0.0.1:3004; keepalive 64; }

server {
    listen 80;
    listen [::]:80;
    server_name sportssphere.fun www.sportssphere.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sportssphere.fun www.sportssphere.fun;

    ssl_certificate     /etc/letsencrypt/live/sportssphere.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportssphere.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 110M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /sportsphere;
    }

    location = /favicon.svg {
        return 302 /sportsphere/favicon.svg;
    }

    location = /favicon.ico {
        return 302 /sportsphere/favicon.svg;
    }

    location = /logo.svg {
        return 302 /sportsphere/logo.svg;
    }

    location = /manifest.json {
        return 302 /sportsphere/manifest.json;
    }

    location /sportsphere/uploads/ {
        alias /var/www/sportsphere-nextjs/WebApp/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /socket.io/ {
        proxy_pass http://sportsphere_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /sportsphere-admin {
        proxy_pass http://sportsphere_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /sportsphere {
        proxy_pass http://sportsphere_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
